[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salp"
version = "0.1.0"
description = "Semantic Alignment Pipeline (SALP): recovers deterministic semantic evidence from GACPD output and constructs characterized Semantic Alignment Packages (SAPs)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SALP Authors" }]
keywords = ["software-evolution", "patch-porting", "reusable-change-adaptation", "sap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/unlv-evol/SALP"
Repository = "https://github.com/unlv-evol/SALP"
Issues = "https://github.com/unlv-evol/SALP/issues"

[project.optional-dependencies]
# Heavy / external-tool integrations, kept optional so the core installs cleanly.
# The Query/QueryCursor API these use landed in tree-sitter 0.25.
structural = ["tree-sitter>=0.25", "tree-sitter-java>=0.23"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
salp = "salp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/salp"]

[tool.pytest.ini_options]
# "." so cross-test imports resolve under plain `pytest`, not only `python -m pytest`
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: exercises a real GACPD sample under data/gacpd/ (skipped when absent)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["salp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abc.abstractmethod",
    "if not TREE_SITTER_AVAILABLE",
]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["salp"]
